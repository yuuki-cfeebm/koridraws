<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koridraws</title>
  <link rel="stylesheet" href="/style/style.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div id="navbar-placeholder"></div>
  
  <div class="overlay">
    <div class="cart-modal">
      <div class="cart-container">
        <div class="cart-top">
          <span class="cart-title">Carrinho</span>
          <div class="cart-btn-close">
            <img src="/assets/icons/x.svg" alt="icon-x">
          </div>
        </div>
        <div class="cart-content">
          <template id="template-cart">
            <div class="item-container">
              <div class="img-item"><img src="" alt=""></div>
              <div class="item-content">
                <div class="item-top"><span></span><div>LIXO</div></div>
                <div class="item-bottom"><div class="add-items"></div><div class="price"></div></div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <main>
    <h2 class="section-title">Eventos Próximos</h2>

    <div class="banner">
      <template class="banner-template">
        <div class="banner-item">
          <img class="img-banner" src="" alt="">
          <span class="event-name-label"></span>
        </div>
      </template>
      <div class="p-0 hidden-x">
        <div class="carousel"></div>
      </div>
      <div class="bullets"></div>
    </div>
    
    <div class="ruler">
      <div class="container ruler-container">
        <template class="template-ruler">
          <div class="ruler-item">
            <img class="img-ruler" src="" alt="">
            <p class="description"></p>
          </div>
        </template>
      </div>
    </div>

    <template class="template-cards">
      <a href="" class="card">
        <div class="container-img">
          <img class="img-card" src="/assets/images/Rectangle.svg" alt="img-banco">
        </div>
        <div class="card-info flex-col-center">
          <div class="card-text" style="align-items: center;"><h2></h2></div>
          <div class="card-prices">
            <p class="full-price" style="display: none;"></p>
            <p class="currently-price"></p>
          </div>
          <button class="buy-btn">Adicionar ao Carrinho</button>
        </div>
      </a>
    </template>

    <template class="section-template">
      
    </template>
    <div class="banner-text container">
      <div class="banner-content">
        <p class="title">Leve sua arte favorita com você!</p>
        <p class="text">Personalize sua mochila, celular, notebook ou aquele cantinho especial com bottons, adesivos e prints exclusivos. Mostre sua paixão pelos seus animes preferidos onde quer que você vá!</p>
        <a class="see-more" href="/assets/pages/product.html">Ver Mais</a>
      </div>
      <img class="banner-text-img" src="/assets/images/image-teste1.png" alt="banner bottom stickers prints">
    </div>

<section class="container" style="margin-top: 40px; margin-bottom: 40px;">
      <h2 class="section-title">Novidades</h2>
      <div id="section-novidades" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; padding: 16px 4px 24px 4px; margin-bottom: 40px;">
      </div>

      <h2 class="section-title">Últimas Unidades</h2>
      <div id="section-ultimas" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; padding: 16px 4px 24px 4px;">
      </div>
    </section>
  </main>

  <footer id="footer-placeholder"></footer>

  <script type="module" src="/js/index.js"></script>
</body>
</html>
