<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos – Koridraws</title>
  <link rel="stylesheet" href="/style/style.css">
  <link rel="stylesheet" href="/style/product.css">
</head>
<body>

  <div id="header-placeholder"></div>
  <div id="navbar-placeholder"></div>
  
  <main class="products-main">

    <div id="gerente-panel" class="gerente-panel">
      <h3 class="gerente-panel-title">Cadastrar Novo Produto</h3>
      
      <form id="form-novo-produto" class="event-form">
        <div class="form-row">
          <label for="novo-item-nome">Nome do Produto</label>
          <input type="text" id="novo-item-nome" required>
        </div>
        
        <div class="form-row">
          <label for="novo-item-preco">Preço</label>
          <input type="number" step="0.01" id="novo-item-preco" required>
        </div>

        <div class="form-row">
          <label for="novo-item-estoque">Estoque Inicial</label>
          <input type="number" step="1" min="0" id="novo-item-estoque" required>
        </div>
        
        <div class="form-row">
          <label for="novo-item-imagens">Imagens do Produto</label>
          <input type="file" id="novo-item-imagens" multiple accept="image/*" required class="file-input-bg">
        </div>
        
        <div id="msg-novo-produto" class="feedback-msg"></div>
        
        <div class="form-actions actions-spaced">
          <button type="submit" class="event-form-btn">Salvar Novo Produto</button>
        </div>
      </form>
    </div>

    <section class="products-section">
      <h2 class="section-title">Nossos Produtos</h2>

      <div id="loading-spinner" class="loading-state">
        Carregando catálogo...
      </div>

      <div class="filters-container">
        <button class="filter-btn active" data-category="Todos">Todos</button>
        <button class="filter-btn" data-category="Adesivos">Adesivos</button>
        <button class="filter-btn" data-category="Bottons">Bottons</button>
        <button class="filter-btn" data-category="Prints">Prints</button>
        <button class="filter-btn" data-category="Chaveiros">Chaveiros</button>
      </div>

      <div id="products-grid" class="products-grid"></div>

      <template id="product-card-template">
        <a class="card" href="">
          <div class="container-img">
            <img class="img-card" src="" alt="Imagem do produto">
          </div>
          <div class="card-tags">
            <div class="tag tag-new d-none">
              <img src="/assets/icons/fita.png" alt="Novo">
            </div>
            <div class="tag tag-discount d-none">
              <img src="/assets/icons/bola.png" alt="Desconto">
            </div>
          </div>
          <div class="card-info flex-col-center">
            <div class="card-text">
              <h2 class="product-title">Nome do Produto</h2>
            </div>
            <div class="card-prices">
              <p class="full-price d-none"></p>
              <p class="currently-price">R$ 0,00</p>
            </div>
            <button class="buy-btn">Adicionar ao Carrinho</button>
          </div>
        </a>
      </template>

    </section>
  </main>

  <footer id="footer-placeholder"></footer>

  <script type="module" src="/js/index.js"></script>
</body>
</html>
