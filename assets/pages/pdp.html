<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos – Koridraws</title>
  <link rel="stylesheet" href="/style/style.css">
  <!-- <link rel="stylesheet" href="/style/product.css"> -->
</head>
<body>

  <div id="header-placeholder"></div>
  <div id="navbar-placeholder"></div>
  
  <main>
    <div class="pdp-container container">
      <div class="content-left">
        <img class="img-main" src="" alt="">
        <div class="container-imgs">

        </div>
      </div>
      <div class="content-right">
        <div class="info-product">
          <p class="pdp-title"></p>
          <p class="pdp-price"></p>
        </div>
        <div class="actions">
          <div class="variations">
            <p>Variação</p>
          </div>
          <div class="buy-item">
            <div class="add-itens">
              <button class="btn minus">
                <img src="/assets/icons/minus.svg" alt="icon-minus">
              </button>
              <span>0</span>
              <button class="btn plus">
                <img src="/assets/icons/plus.svg" alt="icon-plus">
              </button>
            </div>
            <button class="buy-btn">
              <img src="/assets/icons/shopping-cart.svg" alt="icon-cart">
              Adicionar ao carrinho
            </button>
          </div>
          <form class="calc-frete" action="">
            <input type="text" class="cep-mask" maxlength="9" placeholder="00000-000">
            <button class="btn-frete" type="button">Calcular Frete</button>
          </form>
        </div>
      </div>
    </div>


  </main>

  <footer id="footer-placeholder"></footer>

  <script type="module" src="/js/pdp.js"></script>
  <script type="module" src="/js/index.js"></script>
  <script type="module" src="/js/header.js"></script>

</body>
</html>
