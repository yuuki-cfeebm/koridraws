<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos – Koridraws</title>
  <link rel="stylesheet" href="/style/style.css">
</head>
<body>

  <div id="header-placeholder"></div>
  <div id="navbar-placeholder"></div>
  
  <main>
    
    <div id="gerente-edit-panel" style="display: none; width: 100%; max-width: 800px; margin: 24px auto; background: #f9f9f9; padding: 24px; border-radius: 12px; border: 1px solid #e0e0e0;">
      <h3 style="font-family: var(--font-display); margin-top: 0; margin-bottom: 16px;">Editar Produto</h3>
      
      <form id="form-editar-produto" class="event-form">
        <div class="form-row">
          <label for="edit-item-nome">Nome do Produto</label>
          <input type="text" id="edit-item-nome" required>
        </div>
        
        <div class="form-row">
          <label for="edit-item-preco">Preço</label>
          <input type="number" step="0.01" min="0" id="edit-item-preco" required>
        </div>
        
        <div class="form-row">
          <label>Imagens Atuais (Selecione para remover)</label>
          <div id="edit-imagens-atuais" style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px;"></div>
        </div>
        
        <div class="form-row" style="margin-top: 16px;">
          <label for="edit-item-novas-imagens">Adicionar Novas Imagens</label>
          <input type="file" id="edit-item-novas-imagens" multiple accept="image/*" style="background: #fff; padding: 8px;">
        </div>
        
        <div id="msg-editar-produto" style="margin-top: 8px; font-size: 14px; font-weight: bold;"></div>
        
        <div class="form-actions" style="margin-top: 16px;">
          <button type="submit" class="event-form-btn">Salvar Alterações Gerais</button>
        </div>
      </form>

      <hr style="margin: 32px 0; border: none; border-top: 1px solid #ccc;">

      <h3 style="font-family: var(--font-display); margin-top: 0; margin-bottom: 16px;">Estoque</h3>
      <form id="form-editar-estoque" class="event-form">
        <div class="form-row">
          <label for="edit-item-estoque">Estoque Atual</label>
          <input type="number" step="1" min="0" id="edit-item-estoque" required>
        </div>
        <div id="msg-editar-estoque" style="margin-top: 8px; font-size: 14px; font-weight: bold;"></div>
        <div class="form-actions" style="margin-top: 16px;">
          <button type="submit" class="event-form-btn" style="background-color: #2980b9;">Atualizar Estoque</button>
        </div>
      </form>

      <hr style="margin: 32px 0; border: none; border-top: 1px solid #ccc;">

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 14px; color: #c0392b; font-weight: bold;">Zona de Perigo</span>
        <button id="btn-deletar-produto" class="event-form-btn" style="background-color: #c0392b; width: auto; padding: 12px 24px;">Excluir Produto</button>
      </div>
      <div id="msg-deletar-produto" style="margin-top: 8px; font-size: 14px; font-weight: bold; text-align: right;"></div>
    </div>

    <div class="pdp-container container">
      <div class="content-left">
        <img class="img-main" src="" alt="">
        <div class="container-imgs">
        </div>
      </div>
      <div class="content-right">
        <div class="info-product">
          <p class="pdp-title"></p>
          <p class="pdp-price"></p>
        </div>
        <div class="actions">
          <div class="buy-item">
            <div class="add-itens">
              <button class="btn minus">
                <img src="/assets/icons/minus.svg" alt="icon-minus">
              </button>
              <span>0</span>
              <button class="btn plus">
                <img src="/assets/icons/plus.svg" alt="icon-plus">
              </button>
            </div>
            <button class="buy-btn">
              <img src="/assets/icons/shopping-cart.svg" alt="icon-cart">
              Adicionar ao carrinho
            </button>
          </div>
        </div>
      </div>
    </div>

  </main>

  <footer id="footer-placeholder"></footer>

  <script type="module" src="/js/pdp.js"></script>
  <script type="module" src="/js/index.js"></script>
  <script type="module" src="/js/header.js"></script>

</body>
</html>
