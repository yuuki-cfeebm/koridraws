<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda – Koridraws</title>
  <link rel="stylesheet" href="/style/style.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div id="navbar-placeholder"></div>

  <main class="events-main">
  
    <section id="gerente-event-panel" style="display: none; width: 100%; max-width: 800px; margin: 24px auto 48px auto; background: #f9f9f9; padding: 32px; border-radius: 12px; border: 1px solid #e0e0e0;">
      <h3 style="font-family: var(--font-display); margin-top: 0; margin-bottom: 24px;">Cadastrar Novo Evento</h3>
      
      <form id="event-form" class="event-form">
        <div class="form-row">
          <label for="event-title">Nome do Evento</label>
          <input type="text" id="event-title" required>
        </div>
        
        <div class="form-row">
          <label for="event-date">Data do Evento</label>
          <input type="date" id="event-date" required>
        </div>
        
        <div class="form-row">
          <label for="event-details">Detalhes / Descrição</label>
          <textarea id="event-details" rows="4" style="padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-family: var(--font-body); resize: vertical;"></textarea>
        </div>

        <h4 style="font-family: var(--font-display); margin-top: 32px; margin-bottom: 16px;">Endereço do Evento</h4>
        
        <div class="form-row">
          <label for="event-cep">CEP</label>
          <input type="text" id="event-cep" class="cep-mask" required>
        </div>
        
        <div class="form-row">
          <label for="event-rua">Rua</label>
          <input type="text" id="event-rua" required>
        </div>
        
        <div style="display: flex; gap: 16px; width: 100%;">
          <div class="form-row" style="flex: 1;">
            <label for="event-numero">Número</label>
            <input type="text" id="event-numero" required>
          </div>
          <div class="form-row" style="flex: 2;">
            <label for="event-bairro">Bairro</label>
            <input type="text" id="event-bairro" required>
          </div>
        </div>
        
        <div class="form-row">
          <label for="event-complemento">Complemento (Opcional)</label>
          <input type="text" id="event-complemento">
        </div>
        
        <div style="display: flex; gap: 16px; width: 100%;">
          <div class="form-row" style="flex: 1;">
            <label for="event-estado">Estado</label>
            <select id="event-estado" required style="padding: 12px 16px; border: 1px solid #ccc; border-radius: 8px; font-family: var(--font-body); font-size: 16px; outline: none;">
              <option value="" disabled selected>A carregar...</option>
            </select>
          </div>
          <div class="form-row" style="flex: 2;">
            <label for="event-cidade">Cidade</label>
            <select id="event-cidade" required disabled style="padding: 12px 16px; border: 1px solid #ccc; border-radius: 8px; font-family: var(--font-body); font-size: 16px; outline: none;">
              <option value="" disabled selected>Selecione um estado primeiro</option>
            </select>
          </div>
        </div>

        <h4 style="font-family: var(--font-display); margin-top: 32px; margin-bottom: 16px;">Imagens</h4>
        
        <div class="form-row">
          <label for="event-image">Imagens do Evento (Máximo de 4)</label>
          <input type="file" id="event-image" multiple accept="image/*" style="background: #fff; padding: 8px;">
          <img id="image-preview" src="" alt="" style="max-width: 200px; margin-top: 12px; border-radius: 8px; object-fit: cover;">
        </div>

        <div id="event-form-message" style="margin-top: 16px; font-size: 14px; font-weight: bold;"></div>

        <div class="form-actions" style="margin-top: 24px;">
          <button type="submit" class="event-form-btn">Adicionar Evento</button>
        </div>
      </form>
    </section>

    <section class="events-section">
      <h2 class="section-title events-section-title">Próximos Eventos</h2>
      <div class="container-product-carousel flex">
        <button class="back btn-product" id="btn-back-upcoming">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left-icon lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div id="upcoming-carousel" class="cards-container">
        </div>
        <button class="next btn-product" id="btn-next-upcoming">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right-icon lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </section>

    <section class="events-section">
      <h2 class="section-title events-section-title">Eventos Passados</h2>
      <div class="container-product-carousel flex">
        <button class="back btn-product" id="btn-back-past">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left-icon lucide-chevron-left"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div id="past-carousel" class="cards-container">
        </div>
        <button class="next btn-product" id="btn-next-past">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right-icon lucide-chevron-right"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </section>

  </main>

  <footer id="footer-placeholder"></footer>

  <script type="module" src="/js/index.js"></script>
  <script type="module" src="/js/header.js"></script>
  <script type="module" src="/js/agenda.js"></script>

</body>
</html>
