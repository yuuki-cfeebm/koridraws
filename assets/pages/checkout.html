<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout – Koridraws</title>
  <link rel="stylesheet" href="/style/style.css">
  <link rel="stylesheet" href="/style/checkout.css">
</head>
<body>

  <div id="header-placeholder"></div>
  <div id="navbar-placeholder"></div>

  <main class="checkout-main">
    <section class="checkout-section">
      <h2 class="section-title">Finalizar Compra</h2>
      
      <div class="checkout-container">
        <div class="checkout-summary">
          <h3 class="subsection-title">Resumo do Pedido</h3>
          <div id="checkout-items-list" class="cart-items">
            </div>
          <div class="checkout-total">
            <span>Total:</span>
            <span id="checkout-total-price">R$ 0,00</span>
          </div>
        </div>

        <div class="checkout-form-container">
          <h3 class="subsection-title">Entrega e Pagamento</h3>
          
          <div id="novo-endereco-container" style="display: none; margin-bottom: 24px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fafafa;">
            <h4 style="margin-bottom: 16px; font-family: var(--font-display);">Adicionar Novo Endereço</h4>
            <form id="form-novo-endereco" style="display: flex; flex-direction: column; gap: 12px;">
              <input type="text" id="end-cep" placeholder="CEP (00000-000)" class="form-control" required>
              
              <div style="display: flex; gap: 12px;">
                <input type="text" id="end-rua" placeholder="Rua" class="form-control" required style="flex: 2;">
                <input type="text" id="end-numero" placeholder="Número" class="form-control" required style="flex: 1;">
              </div>
              
              <input type="text" id="end-complemento" placeholder="Complemento (Opcional)" class="form-control">
              <input type="text" id="end-bairro" placeholder="Bairro" class="form-control" required>
              
              <div style="display: flex; gap: 12px;">
                <select id="end-estado" class="form-control" required style="flex: 1;">
                  <option value="" disabled selected>Estado</option>
                </select>
                <select id="end-cidadeId" class="form-control" required disabled style="flex: 2;">
                  <option value="" disabled selected>Selecione um estado primeiro</option>
                </select>
              </div>

              <div style="display: flex; gap: 12px; margin-top: 12px;">
                <button type="button" id="btn-cancelar-endereco" class="event-form-btn" style="display:none; background: #ccc; color: #333; flex: 1;">Cancelar</button>
                <button type="submit" class="event-form-btn" style="flex: 1;">Salvar Endereço</button>
              </div>
            </form>
          </div>



          <form id="checkout-form" class="event-form">
            <div class="form-row">
              <label for="select-endereco">Endereço de Entrega *</label>
              <select id="select-endereco" required class="form-control">
                <option value="" disabled selected>A carregar endereços...</option>
              </select>
            </div>

            <div class="frete-container" style="margin: 24px 0; padding: 16px; border: 1px solid #e0e0e0; border-radius: 8px;">
  <h3 style="font-family: var(--font-display); margin-top: 0;">Opções de Entrega</h3>
  
  <div style="display: flex; gap: 8px; margin-bottom: 16px;">
  </div>

  <div id="frete-results" style="display: flex; flex-direction: column; gap: 12px; max-height: 230px; overflow-y: auto; padding-right: 8px;"></div>
</div>
            
            <div class="form-row">
              <label for="select-pagamento">Método de Pagamento *</label>
              <select id="select-pagamento" required class="form-control">
                <option value="" disabled selected>Selecione uma forma de pagamento</option>
                <option value="CartaoCredito">Cartão de Crédito</option>
                <option value="CartaoDebito">Cartão de Débito</option>
                <option value="Boleto">Boleto Bancário</option>
                <option value="Pix">PIX</option>
              </select>
            </div>

            <div class="form-actions">
              <button type="submit" class="event-form-btn btn-finish-order w-100">Confirmar e Pagar</button>
            </div>
          </form>

        </div>
      </div>
    </section>
  </main>

  <footer id="footer-placeholder"></footer>

  <script type="module" src="/js/index.js"></script>
  <script type="module" src="/js/checkout.js"></script>
</body>
</html>
