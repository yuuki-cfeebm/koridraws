<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha – Koridraws</title>
  <link rel="stylesheet" href="/style/style.css">
  <link rel="stylesheet" href="/style/auth.css">
</head>
<body>

  <div id="header-placeholder"></div>
  <div id="navbar-placeholder"></div>

  <main class="auth-main">
    <section class="auth-section">
      <div class="auth-container">
        
        <div class="auth-card">
          <h2 class="section-title">Recuperar Senha</h2>
          <p style="text-align: center; font-size: 0.9em; margin-bottom: 24px;">Informe o seu e-mail para receber as instruções de recuperação.</p>
          
          <form id="form-forgot" class="event-form">
            <div class="form-row">
              <label for="input-email-esqueci">E-mail</label>
              <input type="email" id="input-email-esqueci" required>
            </div>
            <div id="msg-esqueci-senha" style="margin-bottom: 16px; text-align: center; font-size: 0.9em; font-weight: bold;"></div>
            <div class="form-actions">
              <button type="submit" class="event-form-btn">Enviar Instruções</button>
            </div>
          </form>
          
          <p class="auth-toggle-text"><a href="/assets/pages/auth.html" class="auth-toggle-btn" style="text-decoration: none;">Voltar para o Login</a></p>
        </div>

      </div>
    </section>
  </main>

  <footer id="footer-placeholder"></footer>

  <script type="module" src="/js/index.js"></script>
  <script type="module" src="/js/auth.js"></script>
</body>
</html>
