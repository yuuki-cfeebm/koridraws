<header class="site-header">
  <div class="header-top container">
    <a href="/assets/pages/home.html" class="logo" aria-label="Koridraws – Página inicial">
      <div class="logo-mark">
        <img src="/assets/images/pinguim-1.svg" alt="img-logo">
      </div>
      <span class="logo-name">Koridraws</span>
    </a>

    <div class="search-bar">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
      <input type="text" placeholder="Digite...">
    </div>

    <div class="header-actions">
      
      <div class="user-menu-container">
        <button class="action-btn" aria-label="Minha Conta">
          <img src="/assets/icons/user.svg" alt="icon-user">
        </button>
        <div id="user-dropdown" class="user-dropdown"></div>
      </div>

      <button class="action-btn cart-btn" aria-label="Carrinho">
        <img src="/assets/icons/shopping-cart.svg" alt="icon-cart">
        <span class="cart-badge">0</span>
      </button>
    </div>
  </div>  
</header>
<div class="overlay">
    <div class="cart-modal">
      <div class="cart-container">
        <div class="cart-top">
          <span class="cart-title">Carrinho</span>
          <div class="cart-btn-close">
            <img src="/assets/icons/x.svg" alt="icon-x">
          </div>
        </div>
        <div class="cart-content">
          <template id="template-cart">
            <div class="item-container">
              <img class="cart-img-item" src="" alt="">
              <div class="item-cart-content">
                <div class="item-top">
                  <span class="cart-item-title"></span>
                  <div>
                    LIXO
                  </div>
                </div>
                <div class="item-bottom">
                  <div class="add-itens">
                    <button class="btn-minus">
                      <img src="/assets/icons/minus.svg" alt="icon-minus">
                    </button>
                    <span class="item-qtd">0</span>
                    <button class="btn-plus">
                      <img src="/assets/icons/plus.svg" alt="icon-plus">
                    </button>
                  </div>
                  <div class="cart-item-price"> 

                  </div>
                </div>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/js/cart.js"></script>
  <script type="module" src="/js/index.js"></script>
