<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koridraws</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <main>
    <section>
      <h2 class="section-title">Novidades</h2>
      <template id="card-template">
        <div class="card">
          <div class="container-img">
            <img src="assets/images/Rectangle.svg" alt="img-banco">
          </div>
          <div class="card-tags">
            <div class="tag tag-offer">
              <p></p>
            </div>
            <div class="tag tag-new">
              <p></p>
            </div>
            <div class="tag tag-discount">
              <p></p>
            </div>
          </div>
          <div class="card-info flex-col">
            <div class="card-text flex-col">
              <h2></h2>
              <p></p>
            </div>
            <div class="card-prices">
              <div>
                <p class="full-price"></p>
                <p class="currently-price"></p>
              </div>
              <button>
                <img src="assets/icons/heart.svg" alt="icon-heart">
              </button>
            </div>
            <button class="buy-btn">Adicionar ao Carrinho</button>
          </div>
        </div>
      </template>
      <div class="cards-container"></div>
    </section>
    <footer class="footer">
  <div class="footer-container">
    <h2 class="footer-title">KORIDRAWS</h2>

    <ul class="footer-links">
      <li><a href="#">Início</a></li>

      <li><a href="#">Reembolsos</a></li>
    </ul>
  <div class="footer-contact">
  <p><a href="#">(11) 99999-9999 </a></p>
  <p><a href="#">contato@meusite.com</a></p>
</div>
    <p class="footer-copy">© 2026 KORIDRAWS - Todos os direitos reservados.</p>
  </div>
</footer>
